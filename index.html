<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">SimpleShop</div>


        <nav class="nav">
            <a href="#">Home</a>
            <a href="#link1">Products</a>
            
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <!-- MAIN -->
    <main>

        <!-- HERO SECTION -->
        <section class="hero">
            <div class="hero-text">
                <h1>Welcome to SimpleShop</h1>
                <p>Find simple products for your everyday life.</p>
                <button>Shop Now</button>
            </div>
        </section>

        <!-- PRODUCTS SECTION -->
        <section class="products" id="link1">
            <h2>Our Products</h2>

            <div class="product-list">

                <div class="product-card">
                    <div class="product-image">
                        <img src="/static/images/a2.jpg">
                    </div>
                    <h3>Apple</h3>
                    <p>$20</p>
                    <button>Buy Now</button>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="a21.jpg">
                    </div>
                    <h3>Shoes</h3>
                    <p>$50</p>
                    <button>Buy Now</button>
                </div>

                <div class="product-card">
                    <div class="product-image">Product 3</div>
                    <h3>Backpack</h3>
                    <p>$35</p>
                    <button>Buy Now</button>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer" id="link4">
        <p>© 2026 SimpleShop</p>
    </footer>

</body>
</html>
